[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpff"
version = "0.0.2"
description = "GPFF - Generative Pseudo Force Field for molecule generation."
readme = "README.md"
# Held to a single Python version
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Lukasz Sztukiewicz", email = "contact@lukaszsztukiewicz.com"},
    { name = "Stefaan Hessmann", email = "stefaan@posteo.de" },
]
dependencies = [
    # Torch and Lightning stay fixed, as do Hydra and OmegaConf. Torch's
    # CUDA 13 wheels require an NVIDIA driver >= 580.
    "ase==3.29.0",
    "hydra-core==1.4.0rc1",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "omegaconf==2.4.0",
    "petname==2.9",
    "pytorch-lightning==2.6.6",
    "rdkit==2026.9.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "torch==2.14.1",
    "torchmetrics==1.9.0",
    "tqdm==4.70.1",
    "wandb==0.31.0",
    "posebusters==0.6.5",
    # Explicit transitive numerics pins; torch==2.14.1 supplies its own
    # Triton and CUDA 13 constraints.
    "pandas==3.1.1",
    "sympy==1.14.0",
    "networkx==3.7",
    "lightning-utilities==0.15.3",
    "schnetpack @ git+https://github.com/atomistic-machine-learning/schnetpack.git@ab4314d6a328d5f2b4d7a72d5097e3a2e0fef61f",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
]

[project.scripts]
gpff_train = "gpff.cli.train:train"
gpff_generate = "gpff.cli.generate:sample_molecules"
gpff_prepare_metadata = "gpff.cli.prepare_metadata:main"
gpff_prepare_geom_revisited = "gpff.cli.prepare_geom_revisited:main"
gpff_calculate_metrics = "gpff.cli.calculate_metrics:main"
gpff_reference_assets = "gpff.cli.reference_assets:main"

[project.urls]
Homepage = "https://github.com/stefaanhessmann/gpff"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gpff*"]

[tool.setuptools.package-data]
gpff = ["configs/**/*.yaml"]
