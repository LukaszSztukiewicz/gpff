[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpff"
version = "0.0.1"
description = "GPFF - Generative Pseudo Force Field for molecule generation."
readme = "README.md"
# Held to a single Python version, like the pinned numerical stack below.
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Stefaan Hessmann", email = "stefaan@posteo.de" },
]
dependencies = [
    # Numerical stack pinned around torch==2.14.1 (CUDA 13 wheels, needs an
    # NVIDIA driver >= 580); torch releases can change numerical results, so the
    # versions below are held together and bumped as a set.
    "ase==3.26.0",
    "hydra-core==1.4.0rc1",
    "matplotlib==3.10.8",
    "numpy==2.3.2",
    "omegaconf==2.4.0",
    "petname==2.9",
    "pytorch-lightning==2.6.6",
    "rdkit==2025.9.6",
    "scikit-learn==1.8.0",
    "scipy==1.16.1",
    "torch==2.14.1",
    "torchmetrics==1.8.1",
    "tqdm==4.67.3",
    "wandb==0.25.1",
    "posebusters==0.2.12",
    # Extra numerics pins held to the matred_old versions (transitive deps;
    # torch==2.14.1 already pins triton + the CUDA 13 libs).
    "pandas==2.3.2",
    "sympy==1.14.0",
    "networkx==3.5",
    "lightning-utilities==0.15.2",
    "schnetpack @ git+https://github.com/atomistic-machine-learning/schnetpack.git@ab4314d6a328d5f2b4d7a72d5097e3a2e0fef61f",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
]
# gpff_relax --method mace; the models themselves are downloaded separately
mace = [
    "mace-torch",
]

[project.scripts]
gpff_train = "gpff.cli.train:train"
gpff_generate = "gpff.cli.generate:sample_molecules"
gpff_prepare_metadata = "gpff.cli.prepare_metadata:main"
gpff_calculate_metrics = "gpff.cli.calculate_metrics:main"
gpff_reference_assets = "gpff.cli.reference_assets:main"
gpff_relax = "gpff.cli.relax:main"
gpff_report = "gpff.cli.report:main"
# Deprecated alias for gpff_train, kept for existing job scripts.
gpfftrain = "gpff.cli.train:train"

[project.urls]
Homepage = "https://github.com/stefaanhessmann/gpff"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gpff*"]

[tool.setuptools.package-data]
gpff = ["configs/**/*.yaml"]
