# Scaffold atoms stay frozen while the free atoms are denoised towards a target
# covariance and center. Requires a condition generator supplying the scaffold
# mask plus the free covariance and center, e.g.
# condition_generator=precomputed_scaffold.
defaults:
  - /calculator@calculator: default
  - _self_

_target_: gpff.sample.direct_denoising.ShapeScaffoldDirectDenoisingSampler
n_steps: 50
time_aware_model: false
observers:
  - _target_: gpff.sample.observers.ProgressReporter
    verbose: false
    show_progressbar: false
stochastic_lambda: 1.0
f_max: 0.0
prior_shape_denoising_power: 4.0
