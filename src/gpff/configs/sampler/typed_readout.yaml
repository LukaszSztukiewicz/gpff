# direct_denoising with a configurable atom-type readout, for models that
# generate the atom types (experiment=gpff_types*). type_readout=argmax
# reproduces sampler=direct_denoising exactly; see gpff.sample.type_readout.
defaults:
  - /calculator@calculator: default
  - _self_

_target_: gpff.sample.type_readout.ReadoutDirectDenoisingSampler
n_steps: 50
time_aware_model: false
observers:
  - _target_: gpff.sample.observers.ProgressReporter
    verbose: false
    show_progressbar: false
stochastic_lambda: 1.0
f_max: 0.0

# argmax | sample | commit
type_readout: argmax
type_temperature: 1.0
# value of the one-hot entries, for type_readout=commit. null reads it off the
# prediction, which is exact for experiment=gpff_types_categorical; pass the
# run's globals.type_scale for experiment=gpff_types.
type_scale: null
type_seed: 0
# normalize is exact for experiment=gpff_types_categorical (see TypeReadout)
probabilities_from: normalize
