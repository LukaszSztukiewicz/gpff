# Direct denoising under a per-atom design-freedom field: each atom is
# perturbed by the lesser of the schedule's level and its own sigma, and the
# atoms of zero freedom are held at the prior's geometry.
#
# Requires condition_generator=design_freedom and prior=design_freedom. Train
# the model with generative_transform.geometry_sampler.sigma_spread above zero
# so it has seen a field of levels rather than one level per molecule.
defaults:
  - /calculator@calculator: default
  - _self_

_target_: gpff.sample.direct_denoising.DesignFreedomDirectDenoisingSampler
n_steps: 50
time_aware_model: false
observers:
  - _target_: gpff.sample.observers.ProgressReporter
    verbose: false
    show_progressbar: false
stochastic_lambda: 1.0
f_max: 0.0
