# @package _global_
defaults:
  - override /generative_transform: pseudo_pes
  - override /model: nnp
  - override /model/representation: painn
  - override /data: qm9_valid
  - override /prior: gaussian

globals:
  # Architecture
  sigma_max: 30
  cutoff: ${mul:${globals.sigma_max}, 5}
  n_atom_basis: 256
  n_interactions: 4
  n_rbf: ${mul:${globals.cutoff}, 4}
  # growth control: normalized PaiNN blocks and forces bounded like their target
  prenorm: false
  # the messages an interaction sums over the neighbors of an atom are divided by sqrt(degree)
  degree_norm: false
  # every interaction scales the message of a neighbor by an invariant gate that reads the scalars of both atoms and
  # their distance; zero-initialized, so training starts as without gates
  neighbor_gate: false
  bounded_forces: false
  # Independent EDM2-inspired stabilizers; existing runs retain their defaults.
  weight_norm: false
  residual_scaling: false
  normalized_products: false
  radial_norm: false
  output_gain: null
  zero_net_force: false
  # bound on the network's share of the force: the radius of a clean molecule
  # (QM9: 7.4 A) plus what the skip term leaves at intermediate sigma, ~2x
  x0_radius: 15.0
  # EDM's c_skip and c_out for the force, from the skip weight and the molecule's radius
  # (see GatedEquivariant). An alternative to bounded_forces. Pair it with a higher cap of the
  # sigma weights (pseudo_pes.weight_generator.max_clipping=1000, the paper's) to keep the
  # plain head's balance over the noise levels
  preconditioned_forces: false
  # EDM's c_in and c_noise: if set (A), the representation measures distances in units of
  # max(rho, sigma_data), rho the per-axis RMS radius of the input molecule (see PaiNN). Use the
  # largest clean radius of the dataset: QM9 b36d9cd218f5998d 2.48 A (median 1.37), GEOM-Drugs
  # f71e7ef19df1bd58 about 4.2 A (20k sampled rows). The cutoff and the radial basis are then in
  # these units: for QM9, sigma_data=2.5 with globals.cutoff=10 globals.n_rbf=100 keeps the 0.25 A
  # spacing of 600 over 150 A for clean molecules (no pair farther apart than 6 units)
  sigma_data: null

  # Transform alignment
  align_permutation: true
  align_rotation: false
  
  # Training
  weights_key: ${key:forces_weight}
  scale_loss: null
  # Learned per-noise-level loss weights (EDM2), e.g.
  # {_target_: gpff.task.LearnedSigmaWeights}; null keeps the weight generator alone
  sigma_weighting: null
  lr: 1e-4
  
  # Metadata
  model_path: "best_model"

run:
  experiment: gpff
  tags:
    - gpff

prior:
  sigma: ${globals.sigma_max}

model:
  representation:
    cutoff_fn:
      cutoff: ${globals.cutoff}
    n_atom_basis: ${globals.n_atom_basis}
    n_interactions: ${globals.n_interactions}
    radial_basis:
      n_rbf: ${globals.n_rbf}
    prenorm: ${globals.prenorm}
    degree_norm: ${globals.degree_norm}
    neighbor_gate: ${globals.neighbor_gate}
    weight_norm: ${globals.weight_norm}
    residual_scaling: ${globals.residual_scaling}
    normalized_products: ${globals.normalized_products}
    radial_norm: ${globals.radial_norm}
    sigma_data: ${globals.sigma_data}
  output_modules:
    - _target_: gpff.model.heads.GatedEquivariant
      n_in: ${globals.n_atom_basis}
      n_hidden: null
      n_layers: 3
      output_key: ${key:forces}
      bounded: ${globals.bounded_forces}
      x0_radius: ${globals.x0_radius}
      weight_norm: ${globals.weight_norm}
      output_gain: ${globals.output_gain}
      zero_net_force: ${globals.zero_net_force}
      normalized_products: ${globals.normalized_products}
      preconditioned: ${globals.preconditioned_forces}

data:
  transforms:
    - ${generative_transform}
    - _target_: gpff.utils.neighbors.AllToAllNeighborList
    - _target_: schnetpack.transform.CastTo32

task:
  warmup_steps: 0
  outputs:
    - _target_: gpff.task.ModelOutput
      name: ${key:forces}
      metrics:
        mae:
          _target_: torchmetrics.regression.MeanAbsoluteError
        mse:
          _target_: torchmetrics.regression.MeanSquaredError
          squared: True
      loss_weight: 1.
      scale_loss: ${globals.scale_loss}
      weights_key: ${globals.weights_key}
      sigma_weighting: ${globals.sigma_weighting}
