# @package _global_
# Joint position/type diffusion with the categorical head and a graph built in
# PaiNN. The vocabulary covers every element of canonical GEOM-Drugs Revisited
# f71e7ef19df1bd58, including its rare B, Si and Bi atoms (manifest counts.elements).
# Types use Gaussian noise on scaled one-hot vectors. For absorbing masking
# use experiment=gpff_absorbing_geom_drugs instead.
defaults:
  - gpff_types_categorical
  - /model/representation/graph: knn
  - override /model/representation/radial_basis: uniform
  - override /data: geom_drugs_revisited_top5
  - _self_

globals:
  atom_types: [1, 5, 6, 7, 8, 9, 14, 15, 16, 17, 35, 53, 83]
  n_types: 13
  rbf_cutoff: ${globals.cutoff}
  filter_hidden: null
  global_channel: false
  knn_k: 16
  graph_radius: 5.0
  # R_g,ref(N) = c N^e fitted on 20,000 rows of the canonical dataset.
  rg_ref_coefficient: 1.3304
  rg_ref_exponent: 0.2958

run:
  experiment: gpff_types_geom_drugs
  tags:
    - gpff
    - gpff_types
    - gpff_types_categorical
    - geom_drugs
    - scalable
    - graph

model:
  input_modules: []
  representation:
    filter_hidden: ${globals.filter_hidden}
    global_channel: ${globals.global_channel}

data:
  transforms:
    - ${generative_transform}
    - _target_: schnetpack.transform.CastTo32
