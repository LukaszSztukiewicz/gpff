defaults:
  - custom

_target_: gpff.data.datasets.PreparedAtomsData

# a folder written by `gpff_prepare_dataset geom_drugs`: one conformer per row,
# hydrogens included, ~47 atoms each (about 7 times QM9's edges per molecule)
datapath: ${run.data_dir}/geom_drugs.db
# the source's split by molecule; the split file fixes the partitions, so their
# sizes are not set here
split_file: ${run.data_dir}/split.npz
num_train: null
num_val: null
batch_size: 64
num_workers: 16
pin_memory: true
persistent_workers: false
cache_in_memory: false
load_properties: null
