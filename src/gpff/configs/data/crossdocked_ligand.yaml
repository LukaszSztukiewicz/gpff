defaults:
  - custom

_target_: gpff.data.datasets.PreparedAtomsData

# a folder written by `gpff_prepare_dataset crossdocked`: heavy-atom ligands of
# the pocket10 pairs, ~24 atoms each
datapath: ${run.data_dir}/crossdocked_ligand.db
# the official train/test split, with validation pockets carved from train;
# the split file fixes the partitions, so their sizes are not set here
split_file: ${run.data_dir}/split.npz
num_train: null
num_val: null
batch_size: 128
num_workers: 16
pin_memory: true
persistent_workers: false
cache_in_memory: false
load_properties: null
