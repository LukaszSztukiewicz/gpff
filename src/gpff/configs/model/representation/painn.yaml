# PaiNN representation
# Expected globals:
#   - cutoff: Cutoff radius (default: 5.0)
# Note: n_atom_basis, n_interactions are typically overridden by experiments
defaults:
  - radial_basis: gaussian

_target_: gpff.model.PaiNN
n_atom_basis: 128
n_interactions: 3
shared_interactions: False
shared_filters: False
return_vector_representation: True
cutoff_fn:
  _target_: schnetpack.nn.cutoff.CosineCutoff
  cutoff: ${globals.cutoff}