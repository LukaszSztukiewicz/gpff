# Re-seeds RNGs with (base_seed + epoch) each training epoch so that
# checkpoint-resumed training sees the same data as an uninterrupted run (the
# same weights bit-for-bit too with trainer.deterministic=true).
# Val/test noise is pinned per molecule with val_noise_seed (null: fresh noise).
deterministic_data_seed:
    _target_: gpff.callbacks.DeterministicDataSeed
    base_seed: ${seed}
    val_noise_seed: 0
    # seed each training sample's noise from (seed, epoch, database index)
    # instead of from its worker's stream: the noise then no longer depends on
    # data.num_workers, and data.persistent_workers becomes safe to resume
    per_sample_train_noise: false
