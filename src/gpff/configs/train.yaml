# @package _global_

defaults:
  - _self_
  - run: default_run
  - trainer: default_trainer
  - callbacks:
      - checkpoint
      - rng
      - earlystopping
      - lrmonitor
      - ema
      - progress_bar
  - task: default_task
  - logger: wandb
  
  # Experiment-specific (set to null, must be provided by experiment)
  - model: null
  - data: null
  - prior: null
  - generative_transform: null
  - experiment: null
  - mode: null

print_config: True

# Seed for all RNGs; set per run with seed=<int>
seed: 999

# float32 matmul precision; "high" uses TF32 on Ampere or newer GPUs. Set to
# "highest" for full float32 matmuls.
matmul_precision: high

# torch.compile arguments for the model, e.g. {} or {dynamic: true}; null runs
# it eagerly. Needs a C and a C++ compiler (gcc, g++) at run time.
compile: null

# Inference model (e.g. a run's best_model) whose weights a new run starts from,
# for fine-tuning; it needs the same architecture. null initializes randomly.
init_model_path: null

# Default project (can be overridden by experiments)
project: default

# hydra configuration
hydra:
    job:
      chdir: True
    # output paths for hydra logs
    run:
        dir: ${run.path}/${run.id}

    searchpath:
      - file://${oc.env:PWD}
      - file://${oc.env:PWD}/configs

    help:
      app_name: GPFF Train

      template: |-
        Train a GPFF model.

        Usage:
          gpff_train experiment=gpff
          gpff_train experiment=gpff data.batch_size=50 trainer.max_epochs=300

        Your own experiments:
          Put my_exp.yaml in ./experiment/ or ./configs/experiment/, then run
          gpff_train experiment=my_exp

        Resume a run:
          gpff_train experiment=gpff run.id=<run-name> run.path=runs/<project>/<date>

        Show the full config without training:
          gpff_train experiment=gpff --cfg job

        Config groups you can choose from:

        $APP_CONFIG_GROUPS

        ${hydra.help.footer}
