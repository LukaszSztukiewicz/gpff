# @package task
# AdamW with a controlled update size for the weight matrices of the equivariant blocks
# (gpff.optim; Manolache & Niepert, "Equivariance Breaks the Learning Rate").
# Expected globals:
#   - lr: size of the update of every matrix for rms and spectral (its RMS or spectral norm), AdamW-like for muon,
#     normuon and soap; for muonh the fraction of the weight's norm that a step moves it
#   - weight_norm: true for muonh (EDM2's forced weight normalization, see below), optional for the others
#
# block_update: rms | spectral | muon | normuon | muonh | soap | adam (adam = plain AdamW, for control runs). normuon
#               is Muon with every row normalized by its running RMS (Li et al.); soap is Adam in the eigenbasis of
#               Shampoo's preconditioner (Vyas et al.). muonh is Muon on a hypersphere ("Hyperball Optimization"):
#               Muon's direction with the norm of the weight it updates, so lr is relative to that norm. It needs
#               globals.weight_norm=true, which projects every row back onto its sphere after each step:
#                 gpff_train experiment=gpff_stable task/optimizer=block_adam task.optimizer_args.block_update=muonh
#               weight_decay has to be 0 with weight_norm=true: the projection undoes it.
# block_scope:  all (every matrix of the interaction, mixing and head blocks) | vector (only those acting
#               on vector features)
# block_slices: false | true. PaiNN fuses layers that compute 2 or 3 outputs with different roles (the messages of
#               an interaction, the gates of a mixing block, ...) into one weight. true gives every block update one
#               step per role instead of one for the whole weight, as if the roles were separate layers.
# Starting points for globals.lr, from the ratios to Adam's lr in the paper's tuned runs (sweep around
# them): rms ~0.1x, spectral ~3x, muon ~1x the Adam lr. muonh is not from the paper: it moves a weight whose
# entries have RMS one (weight_norm=true) by lr per entry, 5x the step of muon at the same lr (Muon's entries move
# by 0.2 lr), so start from ~0.2x the lr of muon.
optimizer_cls: gpff.optim.BlockAdamW
block_scope: all
block_slices: false
optimizer_args:
  lr: ${globals.lr}
  betas: [0.98, 0.99]  # the paper's choice for normalized updates; AdamW's default is [0.9, 0.999]
  weight_decay: 0.0  # off; when on, decoupled (lr * weight_decay per step) on the block matrices only,
  # never on biases, norm gains, embeddings or the filter net. Reasoned, not tuned: rms ~1e-3, muon 1e-3 to
  # 1e-2 (the LLM value 0.1 would pull these small weights far below their init).
  block_update: rms
  momentum: 0.95  # muon, normuon and muonh
  row_beta: 0.95  # normuon only: decay of the running mean square of every row of the update (the paper's beta2)
  # muon, normuon and muonh: newton_schulz (Muon's polynomial) | polar_express (Amsel et al.: one minimax polynomial per
  # iteration, singular values closer to one for the same 5 iterations)
  orthogonalization: newton_schulz
  precondition_frequency: 10  # soap only: steps between two refreshes of the eigenbases (the costly part)
  shampoo_beta: null  # soap only: decay of the averages of G G^T and G^T G; null: betas[1]
  # soap only: rotate only the smaller side of every matrix (the right one if equal): the 3F x F matrices of the
  # fused layers then need eigenbases of size F, not 3F (block_slices=true instead splits them into F x F roles)
  one_sided: false
